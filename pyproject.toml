[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnadtables"
version = "0.1.0.dev0"
description = "folktables-inspired fairness benchmark tasks on Brazilian PNAD Contínua (IBGE) microdata"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bruno H. M. Oliveira" }]
requires-python = ">=3.9"
keywords = ["fairness", "machine-learning", "benchmark", "census", "brazil", "pnadc", "folktables"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "basedosdados>=2.0",
]

[project.optional-dependencies]
examples = ["scikit-learn>=1.2", "shap>=0.42"]
dev = ["pytest>=7", "scikit-learn>=1.2"]

[project.urls]
Homepage = "https://github.com/Brunooliveirab/pnadtables"
Issues = "https://github.com/Brunooliveirab/pnadtables/issues"

[tool.setuptools.packages.find]
include = ["pnadtables*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
